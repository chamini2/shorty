name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A macOS runner for AppKit, Carbon and the window server the clipboard
    # tests talk to. Swift 6 tools need Xcode 16, which this image carries.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        run: swift --version

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
