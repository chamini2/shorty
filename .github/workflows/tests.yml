name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A macOS runner for AppKit, Carbon and the window server the clipboard
    # tests talk to. macos-14 over macos-15: the same arm64 family, usually
    # the shorter queue, and its image carries an Xcode 16 for the Swift 6
    # tools this package declares.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode on the image
        # The default selection is not always the newest one installed, and
        # `swift-tools-version: 6.0` needs Xcode 16 or later.
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          swift --version

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
